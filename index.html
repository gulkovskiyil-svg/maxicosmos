function recordMatch(){if(matchSaved||!playerName)return;matchSaved=true;const row={name:playerName,mode,score,wave,time:Math.floor(elapsed),date:Date.now()},old=leaders.find(r=>r.name===playerName&&r.mode===mode);if(!old||score>old.score||(score===old.score&&wave>old.wave)){leaders=leaders.filter(r=>r!==old);leaders.push(row)}leaders.sort((a,b)=>b.score-a.score||b.wave-a.wave);leaders=['endless','survival','hard'].flatMap(m=>leaders.filter(r=>r.mode===m).slice(0,50));try{localStorage.setItem(LEADER_KEY,JSON.stringify(leaders))}catch(e){notify('Не удалось сохранить таблицу: память браузера недоступна')}}

else if(which==='leaders'){title.textContent='🏆 Таблица лидеров';body.innerHTML='<p class="tiny">Лучший результат каждого ника в каждом режиме. Только этот браузер и это устройство. Очки записываются после окончания игры.</p><select id="leaderMode"><option value="endless">Бесконечная оборона</option><option value="survival">Выживание</option><option value="hard">Испытание</option></select><div id="leaderRows"></div>';$('leaderMode').value=mode;$('leaderRows').innerHTML=leaderboardHTML(mode);$('leaderMode').onchange=()=>{$('leaderRows').innerHTML=leaderboardHTML($('leaderMode').value)};main.textContent=running?'▶ Продолжить':'К выбору режима';}

function draw(){ctx.save();ctx.translate((Math.random()-.5)*screenShake,(Math.random()-.5)*screenShake);background();if(combo>1&&running){ctx.textAlign='right';ctx.fillStyle='#ffe08a';ctx.font='bold 14px system-ui';ctx.fillText('КОМБО '+combo+' • ×'+Math.min(4,1+Math.floor((combo-1)/3)),W-12,20);ctx.fillStyle='#ffe08a';ctx.fillRect(W-112,27,100*comboTime/3.5,3)}if(aim){ctx.strokeStyle='#aff8ff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(aim.x,aim.y,16,0,Math.PI*2);ctx.moveTo(aim.x-23,aim.y);ctx.lineTo(aim.x+23,aim.y);ctx.moveTo(aim.x,aim.y-23);ctx.lineTo(aim.x,aim.y+23);ctx.stroke()}for(const r of rings){ctx.strokeStyle=r.color;ctx.globalAlpha=1-r.age/.48;ctx.lineWidth=3;ctx.beginPath();ctx.arc(r.x,r.y,r.r*(.4+r.age/.48*.65),0,7);ctx.stroke()}ctx.globalAlpha=1;for(const t of targets)targetDraw(t);bossHUD();for(const a of shots){ctx.strokeStyle='#5ceaff';ctx.lineWidth=3;ctx.beginPath();if(a.trail.length)ctx.moveTo(a.trail[0].x,a.trail[0].y);else ctx.moveTo(a.x,a.y);for(const p of a.trail)ctx.lineTo(p.x,p.y);ctx.lineTo(a.x,a.y);ctx.stroke();interceptorDraw(a)}if(laserBeam){ctx.strokeStyle='#b6ffff';ctx.shadowColor='#39f5ff';ctx.shadowBlur=28;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(station.x,station.y-34);ctx.lineTo(laserBeam.x,laserBeam.y);ctx.stroke();ctx.shadowBlur=0}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;stationDraw();if(mode==='survival'&&running){ctx.fillStyle='#d6f8ff';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText('⏱ '+Math.max(0,Math.ceil(challengeTime-elapsed))+' сек.',W/2,25)}if(flash){ctx.fillStyle='rgba(135,236,255,'+Math.min(.2,flash)+')';ctx.fillRect(0,0,W,H)}ctx.restore()}
function loop(now){let dt=last?Math.min(50,now-last):16.67;last=now;update(dt);if(running&&!paused&&memeQueue.length)nextMeme();draw();requestAnimationFrame(loop)}
